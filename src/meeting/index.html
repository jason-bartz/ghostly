<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Meeting</title>
    <script>
      // Apply the theme before first paint, exactly as index.html does.
      //
      // The panel is a separate webview, so it does not inherit the main
      // window's `data-theme`. Without this it always rendered with the dark
      // token set while the rest of the app followed the user's choice.
      // localStorage is shared across windows of the same origin, and
      // `useAppearanceSync` mirrors the preference there on every change.
      (function () {
        try {
          var saved = localStorage.getItem("ghostly:theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : saved === "system"
                ? window.matchMedia("(prefers-color-scheme: light)").matches
                  ? "light"
                  : "dark"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/meeting/main.tsx"></script>
  </body>
</html>
